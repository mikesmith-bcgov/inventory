<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Geo-Inventory</title>
  <link rel="icon" type="image/svg+xml" href="/inventory/favicon.svg" />
  <link rel="apple-touch-icon" href="/inventory/apple-touch-icon.png" />
  <meta name="theme-color" content="#10141a" />
  <script type="module" crossorigin src="/inventory/assets/index-i8B-FQ1V.js"></script>
  <link rel="stylesheet" crossorigin href="/inventory/assets/index-hQMCjlmi.css">
<link rel="manifest" href="/inventory/manifest.webmanifest"></head>
<body>
  <div id="map"></div>

  <!-- The toolbar and panel. Laid out on their own (display: contents),
       except in a portrait window, where they're one bottom sheet: a
       handle, the toolbar, then the panel (sheet.ts). -->
  <div id="chrome">
  <button id="sheet-handle" type="button" aria-label="Panel size" title="Swipe up or down to resize the panel; tap to open it fully, or back"><span class="grip" aria-hidden="true"></span></button>
  <!-- The toolbar: ui/Toolbar.svelte. -->

  <aside id="panel">
    <!-- Its sections: ui/Panel.svelte. -->
  </aside>
  </div>

  <!-- The help panel (help.ts, ui/HelpPanel.svelte) goes here. -->

  <!-- The ⋮ and right-click menus: ui/Menus.svelte. -->
  <div id="menus"></div>

  <!-- "A new version is ready": ui/UpdatePrompt.svelte (pwa.ts). -->
  <div id="update"></div>

</body>
</html>
